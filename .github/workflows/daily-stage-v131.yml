name: NAS daily collection stage v13.1
run-name: NAS ${{ inputs.request_id }}
on:
  workflow_dispatch:
    inputs:
      request_id: {type: string, required: true}
      snapshot_day: {type: string, required: true}
      segment: {type: string, required: true}
      tasks: {type: string, required: true}
      previous_run: {type: string, required: false, default: ''}
permissions: {contents: read, actions: read}
concurrency:
  group: nas-daily-stage
  cancel-in-progress: false
env:
  TASKS: ${{ inputs.tasks }}
  REQUEST_ID: ${{ inputs.request_id }}
  SNAPSHOT_DAY: ${{ inputs.snapshot_day }}
  SEGMENT: ${{ inputs.segment }}
  PREVIOUS_RUN: ${{ inputs.previous_run }}
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        task: ${{ fromJson(inputs.tasks) }}
    env:
      TASK: ${{ toJson(matrix.task) }}
      PROBE_JOB: ${{ matrix.task.key }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install aiohttp==3.14.3
      - uses: actions/download-artifact@v4
        if: inputs.previous_run != ''
        with:
          name: state-${{ matrix.task.key }}
          path: incoming
          run-id: ${{ inputs.previous_run }}
          github-token: ${{ github.token }}
      - name: Bounded scan with exact checkpoint
        continue-on-error: true
        run: |
          if [ -n "$PREVIOUS_RUN" ]; then
            test -f incoming/checkpoint.json.gz
            python daily_collect_v131.py --task "$TASK" --seed incoming/checkpoint.json.gz
          else
            python daily_collect_v131.py --task "$TASK"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: state-${{ matrix.task.key }}
          path: |
            daily-data/${{ matrix.task.key }}/checkpoint.json.gz
            daily-data/${{ matrix.task.key }}/report.json
            daily-data/${{ matrix.task.key }}/environment-*.json
          retention-days: 1
          if-no-files-found: error
  export:
    needs: collect
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/download-artifact@v4
        with:
          pattern: state-*
          path: collected
          merge-multiple: false
      - run: pip install aiohttp==3.14.3
      - run: python daily_collect_v131.py --export collected
      - uses: actions/upload-artifact@v4
        with:
          name: daily-compact
          path: daily-compact.zip
          retention-days: 1
          if-no-files-found: error
