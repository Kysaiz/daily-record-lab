name: Repair interrupted job collection v16.5.1
run-name: NAS job ${{ inputs.request_id }}
on:
  workflow_dispatch:
    inputs:
      request_id: {type: string, required: true}
      snapshot_day: {type: string, required: true}
      tasks: {type: string, required: true}
      deadline: {type: string, required: true}
      source_run_id: {type: string, required: true}
permissions: {contents: read, actions: read}
concurrency: {group: nas-v14-job, cancel-in-progress: false}
env:
  TASKS: ${{ inputs.tasks }}
  REQUEST_ID: ${{ inputs.request_id }}
  SNAPSHOT_DAY: ${{ inputs.snapshot_day }}
  DEADLINE: ${{ inputs.deadline }}
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install aiohttp==3.14.3
      - id: plan
        env: {TASK: '{}'}
        run: python restore_seed_v1651.py jobs
  collect:
    name: collect (${{ matrix.task.key }})
    needs: prepare
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        item: ${{ fromJson(needs.prepare.outputs.matrix) }}
    uses: ./.github/workflows/chain-32-v143.yml
    with:
      task: ${{ toJson(matrix.item.task) }}
      deadline: ${{ inputs.deadline }}
      seed_run_id: ${{ inputs.source_run_id }}
      seed_artifact: ${{ matrix.item.seed_artifact }}
  export:
    needs: collect
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install aiohttp==3.14.3
      - uses: actions/download-artifact@v4
        with: {pattern: 'cohort-job*', path: collected}
      - run: python collector_v143.py export
      - uses: actions/upload-artifact@v4
        with: {name: daily-compact, path: daily-compact.zip, retention-days: 2}
