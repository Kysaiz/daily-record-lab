name: Repair interrupted Legion collection v16.5.1
run-name: NAS legion ${{ inputs.request_id }}
on:
  workflow_dispatch:
    inputs:
      request_id: {type: string, required: true}
      snapshot_day: {type: string, required: true}
      tasks: {type: string, required: true}
      deadline: {type: string, required: true}
      source_run_id: {type: string, required: true}
permissions: {contents: read, actions: read}
concurrency: {group: nas-v14-legion, cancel-in-progress: false}
env:
  TASKS: ${{ inputs.tasks }}
  REQUEST_ID: ${{ inputs.request_id }}
  SNAPSHOT_DAY: ${{ inputs.snapshot_day }}
  DEADLINE: ${{ inputs.deadline }}
jobs:
  worlds:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        task: ${{ fromJson(inputs.tasks) }}
    uses: ./.github/workflows/legion-repair-world-v1651.yml
    with:
      task: ${{ toJson(matrix.task) }}
      source_run_id: ${{ inputs.source_run_id }}
      deadline: ${{ inputs.deadline }}
  export:
    needs: worlds
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install aiohttp==3.14.3
      - uses: actions/download-artifact@v4
        with: {pattern: 'cohort-legion*', path: collected}
      - run: python collector_v143.py export
      - uses: actions/upload-artifact@v4
        with: {name: daily-compact, path: daily-compact.zip, retention-days: 2}
